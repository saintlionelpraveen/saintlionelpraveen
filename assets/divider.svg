<svg width="100%" height="4" viewBox="0 0 800 4" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="800" height="4" fill="url(#shimmer)" />
</svg>
